<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere - BMC Botoșani</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --accent: #e63946;
            --bg: #0d0d0d;
            --card: #161616;
            --input-bg: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: white;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.95);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; }
        .logo-img { height: 60px; border-radius: 8px; } 
        .logo-text { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 700; }
        .logo-text span { color: var(--accent); }

        .btn-back {
            text-decoration: none;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border: 1px solid #444;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-back:hover {
            background: white;
            color: black;
            border-color: white;
        }

        /* FORM SECTION */
        .form-section {
            flex: 1;
            padding: 60px 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
        }

        .form-container {
            background: var(--card);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .form-group { margin-bottom: 25px; }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: 0.4s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            background: #2a2a2a;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.1);
        }

        /* POPUP STYLES */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .popup {
            background: var(--card);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.2);
        }

        .popup h2 {
            font-family: 'Oswald', sans-serif;
            margin-bottom: 20px;
            color: white;
        }

        .popup p {
            margin-bottom: 30px;
            color: #ccc;
        }

        .btn-reg {
            display: inline-block;
            background: transparent;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border: 1px solid #555;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Oswald', sans-serif;
            transition: 0.3s;
            width: 100%;
        }

        .btn-reg:hover {
            background: #333;
        }

        .btn-accept {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-family: 'Oswald', sans-serif;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-accept:hover {
            background: white;
            color: var(--accent);
        }

        /* OASCUNDEREA FORMULARULUI PÂNĂ LA ACCEPTARE (OPȚIONAL) */
        .hidden-scroll { overflow: hidden; }

        /* CHECKBOX STYLE */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.5;
            text-transform: none;
            color: #bbb;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            font-weight: 900;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.4s;
            letter-spacing: 2px;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.2);
        }

        .btn-submit:hover {
            background: white;
            color: var(--accent);
            transform: translateY(-3px);
        }

        footer {
            padding: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px solid #111;
        }

        @media (max-width: 600px) {
            header { padding: 15px 5%; }
            .logo-text { display: none; }
            .form-section { padding: 30px 5%; }
            .form-container { padding: 30px 20px; }
            .grid-mobile { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body class="hidden-scroll">

    <div class="overlay" id="popupOverlay">
        <div class="popup">
            <h2>Înainte de a continua</h2>
            <p>Pentru a te înscrie în comunitatea BMC, este necesar să citești și să accepți regulamentul nostru intern.</p>
            
            <a href="p.html" class="btn-reg" target="_blank">
                <i class="fas fa-book-open"></i> Citește Regulamentul
            </a>
            
            <button class="btn-accept" onclick="closePopup()">
                Am citit și sunt de acord cu termenii
            </button>
        </div>
    </div>

    <header>
        <a href="index.html" class="logo-container">
            <img src="logo.jpeg" alt="RMC Logo" class="logo-img">
            <div class="logo-text">BMC <span>BOTOȘANI</span></div>
        </a>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Acasă
        </a>
    </header>

    <section class="form-section">
        <div class="form-container">
            <h1>Devino membru</h1>
            <p class="subtitle">Completează datele și alătură-te comunității noastre.</p>

            <form action="https://formsubmit.co/botosanimma@gmail.com" method="POST">
                
                <input type="hidden" name="_next" value="https://rmcbotosani.ro/s.html">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="Înscriere Nouă - RMC Botoșani!">

                <div class="form-group">
                    <label for="nume">Nume și Prenume</label>
                    <input type="text" name="Nume complet" id="nume" placeholder="Cum te numești?" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;" class="grid-mobile">
                    <div class="form-group">
                        <label for="varsta">Vârstă (Minim 14)</label>
                        <input type="number" name="Varsta" id="varsta" min="14" placeholder="Câți ani ai?" required>
                    </div>
                    <div class="form-group">
                        <label for="experienta">Nivel Experiență</label>
                        <select name="Experienta" id="experienta">
                            <option value="Incepator">Începător (Nu am mai făcut)</option>
                            <option value="Mediu">Am mai practicat sporturi de contact</option>
                            <option value="Avansat">Sportiv activ</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Adresă Email (Obligatoriu)</label>
                    <input type="email" name="Email" id="email" placeholder="nume@exemplu.com" required>
                </div>

                <div class="form-group">
                    <label for="telefon">Număr Telefon (Opțional)</label>
                    <input type="tel" name="Telefon" id="telefon" placeholder="07xx xxx xxx">
                </div>

                <div class="form-group">
                    <label for="mesaj">De ce vrei să te antrenezi cu noi?</label>
                    <textarea name="Mesaj" id="mesaj" rows="3" placeholder="Spune-ne câteva cuvinte despre tine..."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="termeni" name="Acord_Regulament" required>
                    <label for="termeni">
                        Confirm că am peste 14 ani și înțeleg că antrenamentele se desfășoară într-un spațiu controlat, pe propria răspundere, respectând codul de onoare al comunității BMC.
                    </label>
                </div>

                <button type="submit" class="btn-submit">Trimite Înscrierea</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 BMC</p>
    </footer>

    <script>
        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            document.body.classList.remove('hidden-scroll');
            // Bifăm automat și căsuța din formular pentru a ușura experiența
            document.getElementById('termeni').checked = true;
        }
    </script>

</body>
</html>
