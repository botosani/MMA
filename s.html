<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere Trimisă - BMC Botoșani</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent: #e63946;
            --bg: #0a0a0a;
            --card: #141414;
            --success: #2ecc71;
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(230, 57, 70, 0.05);
            animation: containerAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Accent red line at top */
        .success-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .logo-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
            padding: 4px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .check-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--success);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 4px solid var(--card);
            animation: popIn 0.5s 0.4s both cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        strong {
            color: white;
            font-weight: 700;
        }

        /* --- Social Grid Styling --- */
        .social-section {
            margin: 30px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 25px;
        }

        .social-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 15px;
            display: block;
            font-weight: 700;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 columns */
            gap: 12px;
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .contact-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .contact-link i { font-size: 1.1rem; }

        /* Brand Colors */
        .insta-btn { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
        }
        .fb-btn { background: #1877F2; }
        .yt-btn { background: #FF0000; }
        .tt-btn { 
            background: #000000; 
            border: 1px solid #333; 
            box-shadow: 0 0 10px rgba(0,255,255,0.1); /* Slight cyan glow for TikTok vibe */
        }
        .tt-btn i { text-shadow: 2px 2px 0px #ff0050, -2px -2px 0px #00f2ea; }

        /* --- Main Home Button --- */
        .btn-home {
            display: block;
            width: 100%;
            text-decoration: none;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-home:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.4);
        }

    </style>
</head>
<body>

    <div class="success-container">
        
        <div class="logo-wrapper">
            <div class="logo-box">
                <img src="logo1.jpeg" alt="BMC Logo">
            </div>
            <div class="check-badge">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <h1>CERERE TRIMISĂ!</h1>
        <p>Salut! Am primit datele tale. Echipa <strong>BMC Botoșani</strong> te va contacta în termen de 24-48 ore pentru confirmare.</p>
        
        <div class="social-section">
            <span class="social-label">Urmărește-ne pentru noutăți</span>
            
            <div class="social-grid">
                <a href="https://www.instagram.com/mma.botosani?igsh=OGdocmozZ3NjNjky" target="_blank" class="contact-link insta-btn">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                
                <a href="https://www.facebook.com/share/1HV6CSWt2Y/" target="_blank" class="contact-link fb-btn">
                    <i class="fab fa-facebook"></i> Facebook
                </a>

                <a href="https://www.youtube.com/@mma.botosani" target="_blank" class="contact-link yt-btn">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
                
                <a href="https://www.tiktok.com/@bmc.botosani" target="_blank" class="contact-link tt-btn">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
            </div>
        </div>

        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Înapoi la Site
        </a>

    </div>

</body>
</html>
