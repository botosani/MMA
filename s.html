<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere Trimisă - BMC Botoșani</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --accent: #e63946;
            --bg: #0a0a0a;
            --card: #121212;
            --success: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .success-container {
            background: rgba(22, 22, 22, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(230, 57, 70, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 20px rgba(230, 57, 70, 0.1);
            animation: containerAppear 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            padding: 5px;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .check-badge {
            position: absolute;
            background: var(--success);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 3px solid var(--card);
            margin-top: -45px;
            margin-left: 85px;
            animation: popIn 0.8s 0.3s both;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        strong {
            color: #fff;
            border-bottom: 1px solid var(--accent);
        }

        .btn-home {
            display: inline-block;
            text-decoration: none;
            background: var(--accent);
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        }

        .btn-home:hover {
            background: #fff;
            color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        .social-hint {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
            color: #777;
        }

        .social-hint i {
            color: var(--accent);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div style="position: relative; display: inline-block;">
            <div class="logo-box">
                <img src="logo1.jpeg" alt="BMC Logo">
            </div>
            <div class="check-badge">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <h1>CERERE TRIMISĂ!</h1>
        <p>Salut! Am primit datele tale. Echipa <strong>BMC</strong> te va contacta pe <strong>Instagram</strong> sau <strong>Email</strong> în termen de 24-48 ore pentru detalii.</p>
        
        <a href="index.html" class="btn-home">Pagina Principală</a>

        <div class="social-hint">
            <i class="fab fa-instagram"></i><br>
            Urmărește-ne pentru noutăți: <br>
            <strong style="border:none; color: var(--accent);">@mma.botosani</strong>
        </div>
    </div>

</body>
</html>
